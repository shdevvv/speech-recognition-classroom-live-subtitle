version: '3.8'

services:
  whisper-asr-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teacher_caption_asr
    ports:
      - "8000:8000"
    volumes:
      # Mounting folder lokal agar perubahan kode langsung ter-update tanpa perlu rebuild container
      - .:/app
      # Cache volume agar model Whisper tidak terunduh berulang kali
      - whisper_models_cache:/app/Python/Whisper/Model/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  whisper_models_cache:
